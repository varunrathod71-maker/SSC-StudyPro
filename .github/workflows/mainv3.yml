name: Build SSC StudyPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find v3 project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'SSCStudyPro_v3_ReferenceUI*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: SSCStudyPro_v3_ReferenceUI.zip was not found in the repository."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found project: $ZIP"
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Extract v3 project
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -q "$ZIP_FILE" -d build_project

          echo "Extracted project:"
          find build_project -maxdepth 4 -type f | sort

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: build_project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSC-StudyPro-v3-APK
          path: build_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
