name: Build SSC StudyPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find v3 project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \
            -iname 'SSCStudyPro_v3_ReferenceUI*.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: SSCStudyPro_v3_ReferenceUI.zip not found."
            ls -la
            exit 1
          fi

          echo "Using: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          set -e

          rm -rf build_project
          mkdir build_project
          unzip -q "$ZIP" -d build_project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find build_project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find build_project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Repair MainActivity Java
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/com/sscstudymanager/MainActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.java not found:"
            echo "$FILE"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          # Fix the Study Plan task array.
          s = s.replace(
              'String[][] tasks={{"06:00 - 07:00","Maths","Completed",GREEN},{"07:00 - 08:00","English","Completed",GREEN},{"09:00 - 10:00","Science","Pending",MUTED},{"11:00 - 12:00","Social Science","Pending",MUTED},{"02:00 - 03:00","Marathi","Pending",MUTED},{"04:00 - 05:00","Revision","Pending",MUTED}};',
              'Object[][] tasks={{"06:00 - 07:00","Maths","Completed",GREEN},{"07:00 - 08:00","English","Completed",GREEN},{"09:00 - 10:00","Science","Pending",MUTED},{"11:00 - 12:00","Social Science","Pending",MUTED},{"02:00 - 03:00","Marathi","Pending",MUTED},{"04:00 - 05:00","Revision","Pending",MUTED}};'
          )

          s = s.replace(
              'for(String[] x:tasks)',
              'for(Object[] x:tasks)'
          )

          s = s.replace(
              'text("☐  "+x[0],10,MUTED)',
              'text("☐  "+String.valueOf(x[0]),10,MUTED)'
          )

          s = s.replace(
              'label(x[1],12)',
              'label(String.valueOf(x[1]),12)'
          )

          s = s.replace(
              'text(x[2],10,(int)x[3])',
              'text(String.valueOf(x[2]),10,(Integer)x[3])'
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("MainActivity.java repaired successfully.")
          PY

      - name: Use compatible Android Gradle Plugin
        shell: bash
        run: |
          set -e

          BUILD="$PROJECT_DIR/build.gradle"

          if [ -f "$BUILD" ]; then
            sed -i \
              "s/com.android.application' version '8.5.2'/com.android.application' version '8.6.1'/" \
              "$BUILD"
          fi

          echo "===== build.gradle ====="
          cat "$BUILD"

      - name: Verify source
        run: |
          echo "===== MainActivity.java ====="

          grep -n \
            -E 'Object\[\]\[\] tasks|for\(Object\[\] x:tasks\)|String.valueOf\(x' \
            "$PROJECT_DIR/app/src/main/java/com/sscstudymanager/MainActivity.java" \
            || true

          echo "=========================="

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSC-StudyPro-v3-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
