name: Build SSC StudyPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate v3 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'SSCStudyPro_v3_ReferenceUI*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SSCStudyPro_v3_ReferenceUI ZIP was not found."
            echo "Repository contents:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir build_project

          unzip -q "$ZIP_FILE" -d build_project

          echo "Extracted files:"
          find build_project -maxdepth 6 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          if [ -f build_project/settings.gradle ]; then
            echo "PROJECT_DIR=build_project" >> "$GITHUB_ENV"
          elif [ -f build_project/settings.gradle.kts ]; then
            echo "PROJECT_DIR=build_project" >> "$GITHUB_ENV"
          else
            PROJECT=$(find build_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

            if [ -z "$PROJECT" ]; then
              echo "ERROR: Android Gradle project was not found."
              find build_project -maxdepth 8 -type f | sort
              exit 1
            fi

            DIR=$(dirname "$PROJECT")
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Verify new MainActivity
        shell: bash
        run: |
          set -e

          FILE=$(find "$PROJECT_DIR" -path '*/src/main/java/com/sscstudymanager/MainActivity.java' -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.java was not found."
            find "$PROJECT_DIR" -type f | sort
            exit 1
          fi

          echo "Found new MainActivity:"
          echo "$FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSC-StudyPro-v3-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
