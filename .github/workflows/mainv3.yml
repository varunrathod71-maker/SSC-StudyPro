name: Build SSC StudyPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate v3 ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname 'SSCStudyPro_v3_ReferenceUI*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "❌ V3 ZIP NOT FOUND"
            ls -la
            exit 1
          fi

          echo "✅ Found: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract v3 project
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -q "$ZIP" -d build_project

          echo "===== PROJECT FILES ====="
          find build_project -maxdepth 8 -type f | sort
          echo "========================="

      - name: Locate Gradle project
        run: |
          PROJECT=$(find build_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "❌ settings.gradle NOT FOUND"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "✅ Gradle project: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Check MainActivity
        run: |
          echo "===== MAIN ACTIVITY ====="
          find "$PROJECT_DIR" -path '*/MainActivity.java' -print
          echo "========================="

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK and show REAL error
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e

          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "           IMPORTANT ERROR"
          echo "========================================"

          grep -B 8 -A 15 -Ei \
            "What went wrong|Execution failed|error:|FAILURE|Could not|Caused by:" \
            build.log | tail -n 150 || true

          echo "========================================"

          exit $RESULT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SSC-StudyPro-v3-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
