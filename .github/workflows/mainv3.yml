name: Build SSC StudyPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find v3 project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'SSCStudyPro_v3_ReferenceUI*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: v3 ZIP not found"
            ls -la
            exit 1
          fi

          echo "Using: $ZIP"
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -q "$ZIP_FILE" -d build_project

      - name: Fix Android Gradle Plugin version
        working-directory: build_project
        run: |
          sed -i "s/com.android.application' version '8.5.2'/com.android.application' version '8.6.1'/" build.gradle
          echo "Updated build.gradle:"
          cat build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: build_project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSC-StudyPro-v3-APK
          path: build_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
