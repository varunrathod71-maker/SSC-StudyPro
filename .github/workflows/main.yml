name: Build SSC StudyPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q SSCStudyPro_v2.0_GitHubReady.zip
          cp -r SSCStudyPro_v2.0_GitHubReady/* .
          cp -r SSCStudyPro_v2.0_GitHubReady/.[!.]* . 2>/dev/null || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSC-StudyPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
